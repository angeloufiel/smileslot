# Supabase CLI settings (used by `supabase link`, `db push` and `supabase start`).
project_id = "smileslot"

[api]
schemas = ["public"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.email]
enable_confirmations = true
